<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
</head>
<body>

  <h1>Web Development Course Registration</h1>

  <form action="#" method="post">
    <p>Student Details:</p>

    <p>
        <label for="fullname">Full name:</label>
        <input type="text" id="fullname" name="fullname" required>
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </p>

      <p>Gender:</p>
      <p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
      </p>
    
      <p>Preferred programming languages:</p>
      <p>
        <input type="checkbox" id="html" name="languages" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="js" name="languages" value="javascript">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="python" name="languages" value="python">
        <label for="python">Python</label>
      </p>

    <p>
        <label for="course">Course:</label>
        <select id="course" name="course" required>
          <option value="html&&css">HTML&&CSS</option>
          <option value="javascript">JavaScript</option>
          <option value="mysql"> MySQL</option>
        </select>
      </p>

    <p>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </p>

  </form>

</body>
</html>
